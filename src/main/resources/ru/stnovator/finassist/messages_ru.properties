ru.stnovator.finassist.ai.view/scheduleImport.laterDate=Укажите дату дополнительного соглашения позднее последней коррекции и подтвердите номер соглашения.
ru.stnovator.finassist.ai.view/scheduleImport.uniqueDocument=Номер или дата дополнительного соглашения уже используются. Укажите свободные номер и дату.

ru.stnovator.finassist.ai.view/scheduleImport.correctionSHIPMENT=Корректировка плана отгрузок
ru.stnovator.finassist.ai.view/scheduleImport.correctionPAYMENT=Корректировка плана платежей
ru.stnovator.finassist.ai.view/scheduleImport.fullSnapshot=Это полный новый снимок плана с даты вступления дополнительного соглашения в силу. Указанные строки заменяют весь применимый план, а не добавляются к нему. Базовый график не изменяется.
ru.stnovator.finassist.ai.view/scheduleImport.existingCorrection=В выбранном соглашении уже есть корректировка этого типа для проекта, в том числе возможна пустая. Её замена этим действием не поддерживается. Ничего не сохранено.
ru.stnovator.finassist.ai.view/scheduleImport.existingLaterCorrection=Для проекта есть корректировка этого типа с такой же или более поздней датой. Изменение последующей истории не поддерживается. Ничего не сохранено.
ru.stnovator.finassist.ai.view/scheduleImport.existingAddendumRequired=Выберите существующее дополнительное соглашение выбранного контракта. Базовый график не изменён.
